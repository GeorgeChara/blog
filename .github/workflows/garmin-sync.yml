name: Sync Garmin Activities

# Run it by hand from the Actions tab. It used to run daily, but the Garmin
# session token expires roughly monthly and a fresh login needs an MFA code,
# so a schedule just produced a failed run every morning until noticed.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [garmin-activity]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/garmin-sync/requirements.txt

      - name: Restore Garmin session token
        env:
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
        run: |
          # Strip whitespace first: a stray newline or a clipboard mishap
          # otherwise surfaces as "gzip: unexpected end of file", which reads
          # like a corrupt token rather than a malformed secret.
          if ! printf '%s' "$GARMIN_TOKEN_B64" | tr -d '[:space:]' | base64 -d > /tmp/tok.tgz 2>/dev/null; then
            echo "::error::GARMIN_TOKEN_B64 is not valid base64. Re-run scripts/garmin-sync/mint-token.py"
            exit 1
          fi
          tar xzf /tmp/tok.tgz -C /tmp
          python scripts/garmin-sync/token_info.py /tmp/garmin_tokens
          # Remember what we started with, so the persist-back step can tell
          # whether the library actually refreshed anything.
          shasum -a 256 /tmp/garmin_tokens/garmin_tokens.json | cut -d" " -f1 > /tmp/tok.sha

      - name: Sync Garmin activities
        env:
          GARMIN_TOKEN_PATH: /tmp/garmin_tokens
          HOME_JSON: ${{ secrets.HOME_JSON }}
        working-directory: scripts/garmin-sync
        run: python sync.py --days 14

      # The library refreshes the short-lived access token and writes the new
      # one back to GARMIN_TOKEN_PATH - but that is a temp dir on a runner that
      # is destroyed minutes later, so without this every run replayed the same
      # ageing snapshot until it died. Saving it back makes the token renew
      # itself on every sync.
      - name: Persist the refreshed token
        if: success()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SECRETS_PAT is not set, so the refreshed token is being discarded."
            echo "Add a fine-grained PAT with Secrets: write as SECRETS_PAT to make the token self-renewing."
            exit 0
          fi
          if [ "$(shasum -a 256 /tmp/garmin_tokens/garmin_tokens.json | cut -d' ' -f1)" = "$(cat /tmp/tok.sha)" ]; then
            echo "Token unchanged; nothing to persist."
            exit 0
          fi
          python scripts/garmin-sync/token_info.py /tmp/garmin_tokens
          tar czf - -C /tmp garmin_tokens | base64 -w0 \
            | gh secret set GARMIN_TOKEN_B64 --repo "$GITHUB_REPOSITORY"
          echo "Refreshed token saved back to GARMIN_TOKEN_B64."

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # git add fails the whole step if any one pathspec matches nothing,
          # and content/cycling/rides only exists once a ride has been written.
          for path in data/cycling static/cycling/gpx static/cycling/og content/cycling/rides; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if git diff --staged --quiet; then
            echo "No new activities to commit"
          else
            git commit -m "Sync cycling activities from Garmin"
            git push
          fi
